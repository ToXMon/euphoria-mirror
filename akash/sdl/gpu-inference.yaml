version: "2.0"

services:
  api:
    image: ghcr.io/toxmon/euphoria-mirror:b8ca58a
    expose:
      - port: 8000
        as: 8000
        to:
          - global: true
    env:
      - GPU_ENABLED=true
      - USE_MOCK_DATA=false
      - KRONOS_TOKENIZER=NeoQuasar/Kronos-Tokenizer-base
      - KRONOS_MODEL=NeoQuasar/Kronos-small
      - KRONOS_MAX_CONTEXT=512
      - BINANCE_BASE_URL=https://api.binance.com
      - CORS_ORIGINS=["*"]

profiles:
  compute:
    api:
      resources:
        cpu:
          units: 4
        memory:
          size: 16Gi
        storage:
          size: 50Gi
        gpu:
          units: 1
          attributes:
            vendor:
              nvidia:
                - model: a10g
  placement:
    dcloud:
      pricing:
        api:
          denom: uact
          amount: 2000

deployment:
  api:
    dcloud:
      profile: api
      count: 1
